AutoContextConfig:
  msgThreshold: 100  #触发压缩的消息数量阈值
  maxToken : 131072  #上下文最大token数量阈值
  tokenRatio : 0.75  #触发压缩的token比例阈值
  lastKeep : 50      #保持未压缩的最近信息数量（仅再策略 1: 压缩历史工具调用、策略 2: 卸载大型消息（带 lastKeep 保护）中生效）
  largePayloadThreshold : 131072  #大型消息阈值（字符数）
  offloadSinglePreview : 200  #卸载消息的预览长度（字符数）
  minConsecutiveToolMessages : 6  #压缩所需的最小连续工具消息数量
  currentRoundCompressionRatio : 0.3  #当前轮次消息的压缩比例

